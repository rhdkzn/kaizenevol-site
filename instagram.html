<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaizenEvol — Instagram Post</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0b18;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      padding: 16px;
    }

    .poster {
      width: min(520px, 100vw - 32px);
      aspect-ratio: 1 / 1;
      background: linear-gradient(150deg, #1a0533 0%, #2d1060 45%, #8B5CF6 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 36px 40px 30px;
      gap: 0;
    }

    /* Subtle noise texture overlay */
    .poster::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.3;
    }

    /* Glow orb top-right */
    .poster::after {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(139,92,246,0.35) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Glow orb bottom-left */
    .glow-bl {
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Logo row */
    .logo-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      align-self: flex-start;
    }

    .logo-img {
      height: 28px;
      width: auto;
      object-fit: contain;
    }

    /* "DONE FOR YOU" badge */
    .tag {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-radius: 100px;
      padding: 5px 14px;
      margin-bottom: 20px;
      align-self: flex-start;
    }

    .tag-dot {
      width: 6px;
      height: 6px;
      background: #a78bfa;
      border-radius: 50%;
      box-shadow: 0 0 6px #8B5CF6;
    }

    .tag-text {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #c4b5fd;
      text-transform: uppercase;
    }

    /* Headline */
    .headline {
      position: relative;
      z-index: 2;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      line-height: 1.25;
      color: #ffffff;
      margin-bottom: 24px;
      align-self: flex-start;
      letter-spacing: -0.3px;
    }

    .headline .highlight {
      color: #a78bfa;
      position: relative;
    }

    .headline .highlight::after {
      content: '';
      position: absolute;
      bottom: 1px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #8B5CF6, #c4b5fd);
      border-radius: 2px;
      opacity: 0.6;
    }

    /* Feature pills row */
    .features {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: row;
      gap: 6px;
      margin-bottom: 24px;
      align-self: flex-start;
      flex-wrap: nowrap;
      width: 100%;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 100px;
      padding: 7px 10px;
      backdrop-filter: blur(8px);
      flex: 1;
      min-width: 0;
    }

    .pill-icon {
      font-size: 11px;
      line-height: 1;
      flex-shrink: 0;
    }

    .pill-text {
      font-size: 9.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Divider line */
    .divider {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(139,92,246,0.5), rgba(139,92,246,0.1), transparent);
      margin-bottom: 18px;
    }

    /* Bottom URL */
    .url {
      position: relative;
      z-index: 2;
      align-self: flex-start;
      font-size: 12px;
      font-weight: 500;
      color: rgba(196, 181, 253, 0.6);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="glow-bl"></div>

    <!-- Logo -->
    <div class="logo-row">
      <img src="logo.png" alt="KaizenEvol" class="logo-img">
    </div>

    <!-- Badge -->
    <div class="tag">
      <span class="tag-dot"></span>
      <span class="tag-text">Done For You</span>
    </div>

    <!-- Headline -->
    <h1 class="headline">
      We fill your calendar<br>
      with <span class="highlight">booked kitchen jobs.</span><br>
      You don't touch a thing.
    </h1>

    <!-- Feature pills -->
    <div class="features">
      <div class="pill">
        <span class="pill-icon">⚡</span>
        <span class="pill-text">AI-Powered Ads</span>
      </div>
      <div class="pill">
        <span class="pill-icon">🔒</span>
        <span class="pill-text">Exclusive Territory</span>
      </div>
      <div class="pill">
        <span class="pill-icon">✓</span>
        <span class="pill-text">Guaranteed Results</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- URL -->
    <p class="url">kaizenevol.com</p>
  </div>
</body>
</html>
