<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KaizenEvol — Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Poppins', sans-serif; background: #0d0b18; color: #f0eeff; min-height: 100vh; line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    :root {
      --purple:      #8B5CF6;
      --purple-d:    #6D3FC0;
      --purple-l:    rgba(139,92,246,0.15);
      --purple-m:    rgba(139,92,246,0.28);
      --bg:          #0d0b18;
      --surface:     #16122a;
      --border:      #2c2448;
      --text:        #f0eeff;
      --muted:       #7a6fa8;
      --green:       #22c55e;
      --amber:       #f59e0b;
      --red:         #f87171;
      --radius:      12px;
      --radius-sm:   8px;
      --radius-pill: 9999px;
      --shadow:      0 2px 20px rgba(0,0,0,0.45);
    }
    #gate { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#0d0b18 0%,#13102a 60%,#1a1438 100%); padding:24px; }
    .gate-card { background:var(--surface); border-radius:20px; padding:48px 40px; width:100%; max-width:400px; box-shadow:0 8px 40px rgba(109,63,192,0.14); text-align:center; }
    .gate-logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:28px; }
    .gate-badge { width:48px; height:48px; border-radius:11px; object-fit:contain; }
    .gate-logo-name { font-size:22px; font-weight:700; }
    .gate-title { font-size:18px; font-weight:700; margin-bottom:6px; }
    .gate-sub { font-size:13px; color:var(--muted); margin-bottom:28px; }
    .gate-input { width:100%; padding:13px 16px; border:2px solid var(--border); border-radius:var(--radius-sm); font-family:'Poppins',sans-serif; font-size:15px; outline:none; transition:border-color .2s; margin-bottom:12px; background:var(--bg); color:var(--text); }
    .gate-input:focus { border-color:var(--purple); }
    .gate-input.error { border-color:var(--red); }
    .gate-input:disabled { opacity:0.5; cursor:not-allowed; }
    .gate-btn { width:100%; padding:13px; background:var(--purple); color:#fff; border:none; border-radius:var(--radius-pill); font-family:'Poppins',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:opacity .2s,transform .15s; }
    .gate-btn:hover:not(:disabled) { opacity:.88; transform:translateY(-1px); }
    .gate-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .gate-err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }
    .gate-lockout { color:var(--amber); font-size:13px; margin-top:6px; min-height:18px; }
    #dashboard { display:none; }
    .dash-header { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:0 32px; }
    .dash-header-inner { max-width:1240px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:58px; gap:16px; }
    .dash-logo { display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; }
    .dash-badge { width:32px; height:32px; border-radius:7px; object-fit:contain; }
    .dash-nav { display:flex; align-items:center; gap:4px; }
    .dash-nav-link { font-size:13px; font-weight:600; color:var(--muted); padding:6px 13px; border-radius:var(--radius-pill); transition:color .2s,background .2s; }
    .dash-nav-link:hover { color:var(--text); background:var(--purple-l); }
    .dash-nav-link.active { color:var(--purple); background:var(--purple-l); }
    .dash-header-right { display:flex; align-items:center; gap:12px; }
    .dash-date { font-size:12px; color:var(--muted); font-weight:500; }
    .btn-logout { font-size:12px; font-weight:600; color:var(--muted); background:none; border:1.5px solid var(--border); border-radius:var(--radius-pill); padding:5px 13px; cursor:pointer; font-family:'Poppins',sans-serif; transition:color .2s,border-color .2s; }
    .btn-logout:hover { color:var(--red); border-color:var(--red); }
    .dash-main { max-width:1240px; margin:0 auto; padding:28px 32px 72px; display:flex; flex-direction:column; gap:28px; }
    .section-label { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--purple); margin-bottom:14px; }
    .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    .stat-card { background:var(--surface); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); border:1px solid var(--border); }
    .stat-card.highlight { background:var(--purple); border-color:var(--purple); }
    .stat-l { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .highlight .stat-l { color:rgba(255,255,255,.65); }
    .stat-v { font-size:30px; font-weight:800; color:var(--text); line-height:1; margin-bottom:5px; }
    .highlight .stat-v { color:#fff; }
    .stat-s { font-size:12px; color:var(--muted); }
    .highlight .stat-s { color:rgba(255,255,255,.65); }
    .prog-bar { height:5px; background:rgba(255,255,255,.25); border-radius:3px; margin-top:10px; overflow:hidden; }
    .prog-fill { height:100%; background:#fff; border-radius:3px; transition:width .4s ease; }
    .card { background:var(--surface); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow); border:1px solid var(--border); }
    .client-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .client-name { font-size:16px; font-weight:700; }
    .client-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .status-badge { font-size:11px; font-weight:700; padding:3px 10px; border-radius:var(--radius-pill); }
    .st-trial    { background:rgba(245,158,11,0.18); color:#fbbf24; }
    .st-retainer { background:rgba(34,197,94,0.15);  color:#4ade80; }
    .st-inactive { background:rgba(156,163,175,0.12); color:#9ca3af; }
    .mini-select { padding:4px 8px; border:1.5px solid var(--border); border-radius:6px; font-family:'Poppins',sans-serif; font-size:12px; outline:none; background:var(--surface); color:var(--text); cursor:pointer; }
    .client-fields { display:flex; gap:24px; flex-wrap:wrap; margin-bottom:10px; }
    .cf { flex:1; min-width:110px; }
    .cf-l { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
    .cf-v { font-size:13px; font-weight:500; color:var(--text); }
    .trial-section { margin-top:14px; }
    .trial-bar { height:7px; background:var(--purple-l); border-radius:4px; overflow:hidden; margin:5px 0; }
    .trial-fill { height:100%; background:var(--purple); border-radius:4px; transition:width .4s; }
    .trial-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
    .date-row { display:flex; align-items:center; gap:8px; margin-top:12px; }
    .date-lbl { font-size:12px; color:var(--muted); white-space:nowrap; }
    .date-inp { padding:5px 10px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:13px; font-family:'Poppins',sans-serif; outline:none; transition:border-color .2s; background:var(--surface); color:var(--text); }
    .date-inp:focus { border-color:var(--purple); }
    .task-row { display:flex; gap:8px; margin-bottom:14px; }
    .task-inp { flex:1; padding:9px 13px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Poppins',sans-serif; font-size:13px; outline:none; transition:border-color .2s; background:var(--bg); color:var(--text); }
    .task-inp:focus { border-color:var(--purple); }
    .add-btn { padding:9px 16px; background:var(--purple); color:#fff; border:none; border-radius:var(--radius-sm); font-family:'Poppins',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:opacity .2s; white-space:nowrap; }
    .add-btn:hover { opacity:.88; }
    .task-list { display:flex; flex-direction:column; gap:5px; }
    .task-item { display:flex; align-items:center; gap:9px; padding:9px 11px; background:var(--bg); border-radius:var(--radius-sm); border:1.5px solid transparent; transition:border-color .2s; }
    .task-item:hover { border-color:var(--border); }
    .task-item.done { opacity:.5; }
    .t-check { width:17px; height:17px; flex-shrink:0; border:2px solid var(--border); border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s,border-color .15s; }
    .t-check.on { background:var(--purple); border-color:var(--purple); }
    .t-check.on::after { content:'✓'; color:#fff; font-size:10px; font-weight:800; }
    .t-text { flex:1; font-size:13px; }
    .task-item.done .t-text { text-decoration:line-through; color:var(--muted); }
    .t-del { font-size:17px; color:var(--muted); cursor:pointer; background:none; border:none; opacity:0; transition:opacity .2s,color .2s; }
    .task-item:hover .t-del { opacity:1; }
    .t-del:hover { color:var(--red); }
    .empty-msg { font-size:12px; color:var(--muted); text-align:center; padding:20px 0; }
    .pipe-row { display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; }
    .pipe-name-inp { flex:2; min-width:130px; padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Poppins',sans-serif; font-size:13px; outline:none; transition:border-color .2s; background:var(--bg); color:var(--text); }
    .pipe-name-inp:focus { border-color:var(--purple); }
    .pipe-sel { flex:1; min-width:110px; padding:8px 10px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Poppins',sans-serif; font-size:13px; outline:none; background:var(--surface); color:var(--text); cursor:pointer; }
    .pipe-list { display:flex; flex-direction:column; gap:5px; }
    .pipe-item { display:flex; align-items:center; gap:8px; padding:8px 11px; background:var(--bg); border-radius:var(--radius-sm); }
    .pipe-name { flex:1; font-size:13px; font-weight:600; }
    .stage-badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:var(--radius-pill); }
    .sg-lead      { background:rgba(56,189,248,0.15);  color:#38bdf8; }
    .sg-discovery { background:rgba(245,158,11,0.15);  color:#fbbf24; }
    .sg-proposal  { background:rgba(244,114,182,0.15); color:#f472b6; }
    .sg-won       { background:rgba(34,197,94,0.15);   color:#4ade80; }
    .sg-lost      { background:rgba(248,113,113,0.15); color:#f87171; }
    .pipe-stage-edit { padding:3px 7px; border:1.5px solid var(--border); border-radius:5px; font-family:'Poppins',sans-serif; font-size:11px; outline:none; background:var(--surface); color:var(--text); cursor:pointer; }
    .p-del { font-size:16px; color:var(--muted); cursor:pointer; background:none; border:none; opacity:0; transition:opacity .2s,color .2s; }
    .pipe-item:hover .p-del { opacity:1; }
    .p-del:hover { color:var(--red); }
    .notes-ta { width:100%; min-height:130px; padding:13px; font-family:'Poppins',sans-serif; font-size:13px; color:var(--text); line-height:1.6; border:1.5px solid var(--border); border-radius:var(--radius-sm); resize:vertical; outline:none; transition:border-color .2s,background .2s; background:var(--bg); }
    .notes-ta:focus { border-color:var(--purple); background:var(--surface); }
    .notes-saved { font-size:11px; color:var(--muted); margin-top:6px; height:14px; }
    .qlinks { display:flex; flex-direction:column; gap:7px; }
    .qlink { display:flex; align-items:center; gap:10px; padding:10px 13px; background:var(--bg); border-radius:var(--radius-sm); font-size:13px; font-weight:600; color:var(--text); transition:background .2s,color .2s; border:1.5px solid transparent; }
    .qlink:hover { background:var(--purple-l); color:var(--purple); border-color:var(--purple-m); }
    .qlink-icon { font-size:15px; }
    .bottom-grid { display:grid; grid-template-columns:2fr 1.2fr 1fr; gap:22px; align-items:start; }
    .side-stack { display:flex; flex-direction:column; gap:22px; }
    /* ── COMMISSION TRACKER ── */
    .comm-add-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .comm-inp { flex:1; min-width:120px; padding:9px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Poppins',sans-serif; font-size:13px; outline:none; transition:border-color .2s; background:var(--bg); color:var(--text); }
    .comm-inp:focus { border-color:var(--purple); }
    .comm-table { width:100%; border-collapse:collapse; font-size:13px; }
    .comm-table th { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); padding:0 8px 10px; text-align:left; border-bottom:1px solid var(--border); }
    .comm-table td { padding:10px 8px; border-bottom:1px solid rgba(44,36,72,0.5); vertical-align:middle; }
    .comm-table tr:last-child td { border-bottom:none; }
    .comm-status { font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--radius-pill); cursor:pointer; border:none; font-family:'Poppins',sans-serif; }
    .cs-pending { background:rgba(245,158,11,0.18); color:#fbbf24; }
    .cs-paid    { background:rgba(34,197,94,0.15);  color:#4ade80; }
    .comm-total-row { display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
    .comm-total-label { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .comm-total-val { font-size:20px; font-weight:800; color:var(--amber); }
    .comm-total-val.paid { color:var(--green); }
    /* ── CLIENT PIPELINE ── */
    .pipeline-track { display:flex; flex-direction:column; gap:20px; }
    .pipe-client { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow); }
    .pipe-client-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
    .pipe-client-name { font-size:15px; font-weight:700; }
    .pipe-stage-label { font-size:11px; font-weight:700; padding:4px 12px; border-radius:var(--radius-pill); }
    .psl-onboarding { background:rgba(56,189,248,0.15); color:#38bdf8; }
    .psl-live       { background:rgba(139,92,246,0.18); color:#a78bfa; }
    .psl-optimising { background:rgba(244,114,182,0.15); color:#f472b6; }
    .psl-conversion { background:rgba(245,158,11,0.2);  color:#fbbf24; }
    .psl-retainer   { background:rgba(34,197,94,0.15);  color:#4ade80; }
    .psl-inactive   { background:rgba(156,163,175,0.1); color:#9ca3af; }
    .pipe-stages { display:flex; align-items:center; gap:0; margin-bottom:18px; }
    .pipe-stage-node { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
    .pipe-stage-node::before { content:''; position:absolute; top:11px; left:-50%; width:100%; height:2px; background:var(--border); z-index:0; }
    .pipe-stage-node:first-child::before { display:none; }
    .pipe-node-dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); background:var(--bg); z-index:1; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; transition:all .3s; }
    .pipe-node-dot.done { background:var(--purple); border-color:var(--purple); }
    .pipe-node-dot.done::after { content:'✓'; color:#fff; }
    .pipe-node-dot.active { background:var(--purple); border-color:var(--purple); box-shadow:0 0 0 4px rgba(139,92,246,0.25); }
    .pipe-node-dot.active::after { content:'●'; color:#fff; font-size:8px; }
    .pipe-node-dot.alert { background:var(--amber); border-color:var(--amber); box-shadow:0 0 0 4px rgba(245,158,11,0.25); }
    .pipe-node-dot.alert::after { content:'!'; color:#fff; font-size:11px; font-weight:900; }
    .pipe-node-dot.retainer-dot { background:var(--green); border-color:var(--green); box-shadow:0 0 0 4px rgba(34,197,94,0.2); }
    .pipe-node-dot.retainer-dot::after { content:'✓'; color:#fff; }
    .pipe-stage-name { font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-top:6px; text-align:center; }
    .pipe-stage-node.active .pipe-stage-name { color:var(--purple); }
    .pipe-stage-node.alert-node .pipe-stage-name { color:var(--amber); }
    .pipe-stage-node.retainer-node .pipe-stage-name { color:var(--green); }
    .pipe-stage-node.done-node .pipe-stage-name { color:var(--muted); }
    .pipe-stage-node.active::before,.pipe-stage-node.done-node::before { background:var(--purple); }
    .pipe-stage-node.retainer-node::before { background:var(--green); }
    .pipe-progress-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .pipe-progress-bar { flex:1; min-width:120px; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
    .pipe-progress-fill { height:100%; border-radius:3px; transition:width .4s ease; }
    .pipe-progress-fill.normal { background:var(--purple); }
    .pipe-progress-fill.alert  { background:var(--amber); }
    .pipe-progress-fill.done   { background:var(--green); }
    .pipe-progress-meta { font-size:12px; color:var(--muted); white-space:nowrap; }
    .pipe-next-action { margin-top:14px; padding:12px 14px; background:var(--bg); border-radius:var(--radius-sm); border-left:3px solid var(--purple); font-size:12px; color:var(--text); line-height:1.5; }
    .pipe-next-action.alert-action { border-left-color:var(--amber); }
    .pipe-next-action.green-action { border-left-color:var(--green); }
    .pipe-next-label { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
    @media(max-width:640px){.stats-row{grid-template-columns:1fr 1fr;}.bottom-grid{grid-template-columns:1fr;}.dash-main{padding:20px 16px 56px;}.dash-header{padding:0 16px;}.stat-v{font-size:24px;}.comm-add-row{flex-direction:column;}.comm-table{font-size:12px;}.pipe-stage-name{font-size:8px;}.pipe-node-dot{width:18px;height:18px;}}
  </style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo"><img src="logo.png" alt="KaizenEvol" class="gate-badge" /><span class="gate-logo-name">KaizenEvol</span></div>
    <div class="gate-title">Dashboard</div>
    <div class="gate-sub">Private access only. Enter your password.</div>
    <input type="password" class="gate-input" id="gateInput" placeholder="Password" autocomplete="off" />
    <button class="gate-btn" id="gateBtn" onclick="attemptLogin()">Unlock &rarr;</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-lockout" id="gateLockout"></div>
  </div>
</div>
<div id="dashboard">
  <header class="dash-header">
    <div class="dash-header-inner">
      <div class="dash-logo"><img src="logo.png" alt="KaizenEvol" class="dash-badge" />KaizenEvol</div>
      <nav class="dash-nav">
        <a href="dashboard.html" class="dash-nav-link active">Dashboard</a>
        <a href="leads.html" class="dash-nav-link">Leads &amp; CRM</a>
      </nav>
      <div class="dash-header-right">
        <span class="dash-date" id="headerDate"></span>
        <button class="btn-logout" onclick="logout()">Log out</button>
      </div>
    </div>
  </header>
  <main class="dash-main">
    <section><div class="section-label">Overview</div><div class="stats-row" id="statsRow"></div></section>
    <section><div class="section-label">Client Pipeline</div><div class="pipeline-track" id="pipelineTrack"></div></section>
    <section><div class="section-label">Clients</div><div id="clientsContainer"></div></section>
    <section><div class="section-label">Commission Tracker</div><div id="commissionContainer"></div></section>
    <div class="bottom-grid">
      <section class="card">
        <div class="section-label">Tasks</div>
        <div class="task-row"><input type="text" class="task-inp" id="taskInput" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()" /><button class="add-btn" onclick="addTask()">+ Add</button></div>
        <div class="task-list" id="taskList"></div>
      </section>
      <section class="card">
        <div class="section-label">Pipeline</div>
        <div class="pipe-row">
          <input type="text" class="pipe-name-inp" id="pipeNameInput" placeholder="Prospect name..." onkeydown="if(event.key==='Enter')addProspect()" />
          <select class="pipe-sel" id="pipeStageInput"><option value="lead">Lead</option><option value="discovery">Discovery</option><option value="proposal">Proposal</option><option value="won">Closed Won</option><option value="lost">Closed Lost</option></select>
          <button class="add-btn" onclick="addProspect()">+</button>
        </div>
        <div class="pipe-list" id="pipelineList"></div>
      </section>
      <div class="side-stack">
        <section class="card">
          <div class="section-label">Notes</div>
          <textarea class="notes-ta" id="notesArea" placeholder="Freeform notes..." oninput="scheduleNoteSave()"></textarea>
          <div class="notes-saved" id="notesSaved"></div>
        </section>
        <section class="card">
          <div class="section-label">Quick Links</div>
          <div class="qlinks">
            <a href="leads.html" class="qlink"><span class="qlink-icon">📊</span> Leads &amp; CRM</a>
            <a href="https://calendly.com/rahaid-kaizenevol/initial-call" target="_blank" class="qlink"><span class="qlink-icon">📅</span> Calendly</a>
            <a href="mailto:rahaid@kaizenevol.com" class="qlink"><span class="qlink-icon">📧</span> rahaid@kaizenevol.com</a>
            <a href="https://kaizenevol.com" target="_blank" class="qlink"><span class="qlink-icon">🌐</span> KaizenEvol Site</a>
            <a href="https://business.facebook.com" target="_blank" class="qlink"><span class="qlink-icon">📣</span> Meta Business Suite</a>
            <a href="https://adsmanager.facebook.com" target="_blank" class="qlink"><span class="qlink-icon">📊</span> Ads Manager</a>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<script>
const PW_SALT='0f45e8c98a23269130d1d1704e0e135f',PW_HASH='6f853cb4d060884a4dd3949c23fdb519ad8d8fac70ce9d27d0824a52a2a39350',PW_ITER=200000,SESSION_KEY='ke_session',DATA_KEY='ke_data',LOCKOUT_KEY='ke_lockout',SESSION_TTL=864e5,IDLE_TTL=18e5,MAX_ATTEMPTS=5,LOCKOUT_TTL=18e5;
async function pbkdf2Hash(password){const enc=new TextEncoder();const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(PW_SALT),iterations:PW_ITER,hash:'SHA-256'},keyMaterial,256);return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function getLockout(){try{return JSON.parse(localStorage.getItem(LOCKOUT_KEY)||'{}');}catch(e){return {};}}
function isLockedOut(){const l=getLockout();return l.until&&Date.now()<l.until;}
function remainingLockout(){const l=getLockout();return Math.max(0,Math.ceil((l.until-Date.now())/60000));}
function recordFailedAttempt(){const l=getLockout();const attempts=(l.attempts||0)+1;const until=attempts>=MAX_ATTEMPTS?Date.now()+LOCKOUT_TTL:null;localStorage.setItem(LOCKOUT_KEY,JSON.stringify({attempts,until}));return attempts;}
function clearLockout(){localStorage.removeItem(LOCKOUT_KEY);}
function applyLockoutUI(){const inp=document.getElementById('gateInput'),btn=document.getElementById('gateBtn'),el=document.getElementById('gateLockout');if(isLockedOut()){inp.disabled=btn.disabled=true;el.textContent=`Too many failed attempts. Try again in ${remainingLockout()} minute(s).`;setTimeout(applyLockoutUI,30000);}else{inp.disabled=btn.disabled=false;el.textContent='';}}
let idleTimer=null;
function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{logout();document.getElementById('gateLockout').textContent='Session expired due to inactivity.';},IDLE_TTL);}
function startIdleWatch(){['mousemove','keydown','click','scroll','touchstart'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));resetIdle();}
function stopIdleWatch(){clearTimeout(idleTimer);['mousemove','keydown','click','scroll','touchstart'].forEach(e=>document.removeEventListener(e,resetIdle));}
async function attemptLogin(){if(isLockedOut()){applyLockoutUI();return;}const pw=document.getElementById('gateInput').value;if(!pw)return;const btn=document.getElementById('gateBtn');btn.disabled=true;btn.textContent='Verifying…';const hash=await pbkdf2Hash(pw);btn.textContent='Unlock →';if(hash===PW_HASH){clearLockout();localStorage.setItem(SESSION_KEY,JSON.stringify({hash,expires:Date.now()+SESSION_TTL}));showDashboard();}else{const attempts=recordFailedAttempt();const inp=document.getElementById('gateInput');inp.classList.add('error');const errEl=document.getElementById('gateErr');if(isLockedOut()){errEl.textContent='';applyLockoutUI();}else{const left=MAX_ATTEMPTS-attempts;errEl.textContent=left>0?`Incorrect password. ${left} attempt(s) remaining.`:'Incorrect password.';}inp.value='';btn.disabled=false;setTimeout(()=>{inp.classList.remove('error');errEl.textContent='';},2400);}}
function tryAutoLogin(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'{}');if(s.hash===PW_HASH&&s.expires>Date.now()){showDashboard();return;}}catch(e){}applyLockoutUI();}
function logout(){stopIdleWatch();localStorage.removeItem(SESSION_KEY);document.getElementById('dashboard').style.display='none';document.getElementById('gate').style.display='flex';document.getElementById('gateInput').value='';document.getElementById('gateLockout').textContent='';applyLockoutUI();}
function showDashboard(){document.getElementById('gate').style.display='none';document.getElementById('dashboard').style.display='block';startIdleWatch();init();}
document.getElementById('gateInput').addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin();});
const DEFAULTS={clients:[{id:'nav',name:'Navpreet Singh',status:'trial',terms:'20% commission of job value',adSpend:'£300–500',retainerValue:3500,trialDays:60,trialStartDate:''}],metrics:{nav:{cpr:'',ctr:'',bookedCalls:'',spend:'',updated:''}},commission:{jobs:[]},tasks:[],pipeline:[],notes:'',settings:{goalRetainers:10,retainerValue:3500}};
function load(){try{const r=localStorage.getItem(DATA_KEY);return r?{...structuredClone(DEFAULTS),...JSON.parse(r)}:structuredClone(DEFAULTS);}catch(e){return structuredClone(DEFAULTS);}}
function save(data){localStorage.setItem(DATA_KEY,JSON.stringify(data));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function trialDays(startStr,total){if(!startStr)return null;const diff=Math.floor((Date.now()-new Date(startStr))/86400000);return{day:Math.max(1,diff+1),total};}
function renderStats(data){
  const retainers=data.clients.filter(c=>c.status==='retainer');
  const active=data.clients.filter(c=>c.status!=='inactive');
  const mrr=retainers.reduce((n,c)=>n+(c.retainerValue||3500),0);
  const goal=data.settings.goalRetainers||10;
  const pct=Math.min(100,Math.round(retainers.length/goal*100));
  const nav=data.clients.find(c=>c.id==='nav');
  // Trial days remaining
  let trialDaysLeft='—'; let trialDay='—';
  if(nav&&nav.status==='trial'){const t=trialDays(nav.trialStartDate,nav.trialDays);if(t){trialDay=`Day ${t.day}`;trialDaysLeft=`${Math.max(0,t.total-t.day+1)} days left`;}}
  else if(nav&&nav.status==='retainer'){trialDay='Retainer';trialDaysLeft='✓ Converted';}
  // Commission pending
  const jobs=(data.commission&&data.commission.jobs)||[];
  const pending=jobs.filter(j=>j.status==='pending').reduce((s,j)=>s+(j.commission||0),0);
  // Booked calls this month
  const navMetrics=data.metrics&&data.metrics.nav||{};
  const bookedCalls=navMetrics.bookedCalls||'—';
  document.getElementById('statsRow').innerHTML=`
    <div class="stat-card highlight"><div class="stat-l">Goal Progress</div><div class="stat-v">${retainers.length} / ${goal}</div><div class="stat-s">£${mrr.toLocaleString()} MRR of £${(goal*(data.settings.retainerValue||3500)).toLocaleString()}/mo target</div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>
    <div class="stat-card"><div class="stat-l">Nav Trial</div><div class="stat-v" style="font-size:26px">${trialDay}</div><div class="stat-s">${trialDaysLeft}</div></div>
    <div class="stat-card"><div class="stat-l">Booked Calls (this month)</div><div class="stat-v">${bookedCalls}</div><div class="stat-s">Nav — qualified consultations</div></div>
    <div class="stat-card"><div class="stat-l">Commission Owed</div><div class="stat-v" style="color:var(--amber)">£${pending.toLocaleString()}</div><div class="stat-s">${jobs.filter(j=>j.status==='pending').length} job(s) unpaid</div></div>`;
}
function stClass(s){return{trial:'st-trial',retainer:'st-retainer',inactive:'st-inactive'}[s]||'st-inactive';}
function stLabel(s){return{trial:'⏱ Trial',retainer:'✓ Retainer',inactive:'○ Inactive'}[s]||s;}
function renderClients(data){document.getElementById('clientsContainer').innerHTML=data.clients.map(c=>{const t=c.status==='trial'?trialDays(c.trialStartDate,c.trialDays):null;const pct=t?Math.min(100,Math.round(t.day/t.total*100)):0;return`<div class="card" style="margin-bottom:14px;"><div class="client-head"><div class="client-name">${esc(c.name)}</div><div class="client-controls"><span class="status-badge ${stClass(c.status)}">${stLabel(c.status)}</span><select class="mini-select" onchange="setClientStatus('${c.id}',this.value)"><option value="trial" ${c.status==='trial'?'selected':''}>Trial</option><option value="retainer" ${c.status==='retainer'?'selected':''}>Retainer</option><option value="inactive" ${c.status==='inactive'?'selected':''}>Inactive</option></select></div></div><div class="client-fields"><div class="cf"><div class="cf-l">Terms</div><div class="cf-v">${esc(c.terms)}</div></div><div class="cf"><div class="cf-l">Ad Spend</div><div class="cf-v">${esc(c.adSpend)}</div></div><div class="cf"><div class="cf-l">Retainer Value</div><div class="cf-v">£${(c.retainerValue||3500).toLocaleString()}/mo</div></div></div>${c.status==='trial'?`<div class="trial-section"><div class="trial-bar"><div class="trial-fill" style="width:${pct}%"></div></div><div class="trial-meta"><span>${t?`Day ${t.day} of ${t.total}`:'Set start date below'}</span><span>${t?`${Math.max(0,t.total-t.day+1)} days remaining`:''}</span></div></div><div class="date-row"><span class="date-lbl">Trial start date:</span><input type="date" class="date-inp" value="${c.trialStartDate||''}" onchange="setTrialStart('${c.id}',this.value)" /></div>`:''}</div>`;}).join('');}
function setClientStatus(id,status){const d=load();const c=d.clients.find(x=>x.id===id);if(c){c.status=status;save(d);renderStats(d);renderClientPipeline(d);renderClients(d);}}
function setTrialStart(id,date){const d=load();const c=d.clients.find(x=>x.id===id);if(c){c.trialStartDate=date;save(d);renderStats(d);renderClientPipeline(d);renderClients(d);}}
const PIPE_STAGES=[
  {key:'onboarding', label:'Onboarding'},
  {key:'live',       label:'Campaign Live'},
  {key:'optimising', label:'Optimising'},
  {key:'conversion', label:'Conversion Due'},
  {key:'retainer',   label:'Retainer'}
];
function getClientStage(c){
  if(c.status==='inactive')return{key:'inactive',label:'Inactive',day:0,daysLeft:0,pct:0};
  if(c.status==='retainer')return{key:'retainer',label:'Retainer',day:60,daysLeft:0,pct:100};
  if(!c.trialStartDate)return{key:'onboarding',label:'Onboarding',day:0,daysLeft:60,pct:0};
  const t=trialDays(c.trialStartDate,c.trialDays||60);
  if(!t)return{key:'onboarding',label:'Onboarding',day:0,daysLeft:60,pct:0};
  const day=t.day; const total=t.total; const left=Math.max(0,total-day+1);
  const pct=Math.min(100,Math.round(day/total*100));
  if(day>=55)return{key:'conversion',label:'Conversion Due',day,daysLeft:left,pct};
  if(day>=31)return{key:'optimising',label:'Optimising',day,daysLeft:left,pct};
  return{key:'live',label:'Campaign Live',day,daysLeft:left,pct};
}
function getNextAction(stageKey,daysLeft,clientName){
  const n=clientName.split(' ')[0];
  switch(stageKey){
    case 'onboarding': return{text:`Set ${n}'s trial start date to begin campaign tracking.`,cls:''};
    case 'live':       return{text:`Campaign running. Monitor daily spend and early lead quality. ${daysLeft} days to optimisation phase.`,cls:''};
    case 'optimising': return{text:`Cut underperformers, scale winners. Start building retainer case. ${daysLeft} days to conversion conversation.`,cls:''};
    case 'conversion': return{text:`Book retainer conversion call with ${n} — ${daysLeft} day(s) remaining on trial.`,cls:'alert-action'};
    case 'retainer':   return{text:`${n} is on retainer. Focus on results, retention, and case study.`,cls:'green-action'};
    default:           return{text:'',cls:''};
  }
}
function renderClientPipeline(data){
  const el=document.getElementById('pipelineTrack');
  const active=data.clients.filter(c=>c.status!=='inactive');
  if(!active.length){el.innerHTML='<div style="color:var(--muted);font-size:13px;">No active clients.</div>';return;}
  el.innerHTML=active.map(c=>{
    const s=getClientStage(c);
    const stageIdx=PIPE_STAGES.findIndex(p=>p.key===s.key);
    const action=getNextAction(s.key,s.daysLeft,c.name);
    const fillCls=s.key==='conversion'?'alert':s.key==='retainer'?'done':'normal';
    const stageLabelCls=`psl-${s.key==='inactive'?'inactive':s.key}`;
    const nodes=PIPE_STAGES.map((p,i)=>{
      let dotCls=''; let nodeCls='';
      if(i<stageIdx){dotCls='done';nodeCls='done-node';}
      else if(i===stageIdx){
        if(s.key==='conversion'){dotCls='alert';nodeCls='alert-node';}
        else if(s.key==='retainer'){dotCls='retainer-dot';nodeCls='retainer-node';}
        else{dotCls='active';nodeCls='active';}
      }
      return`<div class="pipe-stage-node ${nodeCls}"><div class="pipe-node-dot ${dotCls}"></div><div class="pipe-stage-name">${p.label}</div></div>`;
    }).join('');
    const progressRow=s.key!=='onboarding'&&s.key!=='inactive'?`<div class="pipe-progress-row"><div class="pipe-progress-bar"><div class="pipe-progress-fill ${fillCls}" style="width:${s.pct}%"></div></div><div class="pipe-progress-meta">${s.key==='retainer'?'Converted ✓':`Day ${s.day} / ${c.trialDays||60} &mdash; ${s.daysLeft} days left`}</div></div>`:'';
    return`<div class="pipe-client">
      <div class="pipe-client-header"><div class="pipe-client-name">${esc(c.name)}</div><span class="pipe-stage-label ${stageLabelCls}">${s.label}</span></div>
      <div class="pipe-stages">${nodes}</div>
      ${progressRow}
      ${action.text?`<div class="pipe-next-action ${action.cls}"><div class="pipe-next-label">Next Action</div>${esc(action.text)}</div>`:''}
    </div>`;
  }).join('');
}
function renderCommission(data){
  if(!data.commission)data.commission={jobs:[]};
  const jobs=data.commission.jobs||[];
  const pending=jobs.filter(j=>j.status==='pending').reduce((s,j)=>s+(j.commission||0),0);
  const totalPaid=jobs.filter(j=>j.status==='paid').reduce((s,j)=>s+(j.commission||0),0);
  const rows=jobs.length?jobs.map((j,i)=>`<tr>
    <td>${esc(j.date||'—')}</td>
    <td>${esc(j.clientName||'Nav')}</td>
    <td>£${Number(j.jobValue||0).toLocaleString()}</td>
    <td style="color:var(--amber);font-weight:700">£${Number(j.commission||0).toLocaleString()}</td>
    <td><button class="comm-status ${j.status==='paid'?'cs-paid':'cs-pending'}" onclick="toggleCommStatus(${i})">${j.status==='paid'?'Paid':'Pending'}</button></td>
    <td><button class="t-del" style="opacity:1;font-size:15px" onclick="delJob(${i})">×</button></td>
  </tr>`).join(''):'<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:20px 0;">No jobs logged yet.</td></tr>';
  document.getElementById('commissionContainer').innerHTML=`<div class="card">
    <div class="comm-add-row">
      <input type="date" class="comm-inp" id="commDate" style="max-width:160px" />
      <input type="text" class="comm-inp" id="commClient" placeholder="Client name" value="Navpreet Singh" style="max-width:180px" />
      <input type="number" class="comm-inp" id="commValue" placeholder="Job value (£)" min="0" style="max-width:160px" />
      <button class="add-btn" onclick="addJob()">+ Log Job</button>
    </div>
    <table class="comm-table">
      <thead><tr><th>Date</th><th>Client</th><th>Job Value</th><th>Commission (20%)</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="comm-total-row">
      <div>
        <div class="comm-total-label">Commission Owed</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">£${totalPaid.toLocaleString()} paid to date</div>
      </div>
      <div class="comm-total-val ${pending===0&&jobs.length?'paid':''}">£${pending.toLocaleString()}</div>
    </div>
  </div>`;}
function addJob(){const date=document.getElementById('commDate').value;const clientName=document.getElementById('commClient').value.trim()||'Navpreet Singh';const jobValue=parseFloat(document.getElementById('commValue').value);if(!jobValue||jobValue<=0)return;const commission=Math.round(jobValue*0.2*100)/100;const d=load();if(!d.commission)d.commission={jobs:[]};d.commission.jobs.unshift({date,clientName,jobValue,commission,status:'pending'});save(d);renderCommission(d);renderStats(d);document.getElementById('commValue').value='';document.getElementById('commDate').value='';}
function toggleCommStatus(i){const d=load();if(!d.commission||!d.commission.jobs[i])return;d.commission.jobs[i].status=d.commission.jobs[i].status==='paid'?'pending':'paid';save(d);renderCommission(d);renderStats(d);}
function delJob(i){const d=load();if(!d.commission)return;d.commission.jobs.splice(i,1);save(d);renderCommission(d);renderStats(d);}
function renderTasks(data){const el=document.getElementById('taskList');if(!data.tasks.length){el.innerHTML='<div class="empty-msg">No tasks yet.</div>';return;}el.innerHTML=data.tasks.map((t,i)=>`<div class="task-item ${t.done?'done':''}"><div class="t-check ${t.done?'on':''}" onclick="toggleTask(${i})"></div><span class="t-text">${esc(t.text)}</span><button class="t-del" onclick="delTask(${i})">×</button></div>`).join('');}
function addTask(){const inp=document.getElementById('taskInput');const txt=inp.value.trim();if(!txt)return;const d=load();d.tasks.unshift({text:txt,done:false});save(d);renderTasks(d);inp.value='';}
function toggleTask(i){const d=load();d.tasks[i].done=!d.tasks[i].done;save(d);renderTasks(d);}
function delTask(i){const d=load();d.tasks.splice(i,1);save(d);renderTasks(d);}
const STAGE_LBL={lead:'Lead',discovery:'Discovery',proposal:'Proposal',won:'Won ✓',lost:'Lost'};
function renderPipeline(data){const el=document.getElementById('pipelineList');if(!data.pipeline.length){el.innerHTML='<div class="empty-msg">No prospects yet.</div>';return;}el.innerHTML=data.pipeline.map((p,i)=>`<div class="pipe-item"><span class="pipe-name">${esc(p.name)}</span><select class="pipe-stage-edit" onchange="setPipeStage(${i},this.value)">${Object.entries(STAGE_LBL).map(([v,l])=>`<option value="${v}" ${p.stage===v?'selected':''}>${l}</option>`).join('')}</select><button class="p-del" onclick="delProspect(${i})">×</button></div>`).join('');}
function addProspect(){const n=document.getElementById('pipeNameInput').value.trim();const s=document.getElementById('pipeStageInput').value;if(!n)return;const d=load();d.pipeline.push({name:n,stage:s});save(d);renderPipeline(d);document.getElementById('pipeNameInput').value='';}
function setPipeStage(i,s){const d=load();d.pipeline[i].stage=s;save(d);renderPipeline(d);}
function delProspect(i){const d=load();d.pipeline.splice(i,1);save(d);renderPipeline(d);}
let notesTimer=null;
function scheduleNoteSave(){clearTimeout(notesTimer);notesTimer=setTimeout(()=>{const d=load();d.notes=document.getElementById('notesArea').value;save(d);const el=document.getElementById('notesSaved');el.textContent='Saved.';setTimeout(()=>{el.textContent='';},1800);},700);}
function init(){document.getElementById('headerDate').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'});const d=load();renderStats(d);renderClientPipeline(d);renderClients(d);renderCommission(d);renderTasks(d);renderPipeline(d);document.getElementById('notesArea').value=d.notes||'';}
tryAutoLogin();
</script>
</body>
