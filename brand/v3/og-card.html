<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';src:url('/manrope.woff2') format('woff2');font-weight:200 800;font-style:normal}
@font-face{font-family:'Newsreader';src:url('/newsreader-italic.woff2') format('woff2');font-weight:300;font-style:italic}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{background:#F7F6F4;color:#23211E;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.card{position:relative;width:1200px;height:630px;padding:70px 76px;display:flex;flex-direction:column;justify-content:space-between}
.wash{position:absolute;right:-170px;top:-190px;width:560px;height:560px;border-radius:50%;background:#EFEDE9;z-index:0}
.card>.top,.card>h1,.card>div:last-child{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:14px}
.top img{height:46px;width:auto}
.top b{font-size:31px;font-weight:600;letter-spacing:-0.025em}
h1{font-weight:200;font-size:78px;line-height:1.05;letter-spacing:-0.04em;max-width:930px}
h1 em{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:300}
.rule{height:1px;background:#D8D4CC;margin-bottom:26px}
.foot{display:flex;align-items:baseline;justify-content:space-between}
.foot .l{font-size:25px;font-weight:500;color:#6E6A63;letter-spacing:-0.01em}
.foot .r{font-size:14px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#8A857C}
</style></head><body>
<div class="card">
  <div class="wash"></div>
  <div class="top"><img src="/brand/v3/ke-mark-ink-512.png" alt=""><b>KaizenEvol</b></div>
  <h1>Creative growth agency<br>for brands and <em>artists</em>.</h1>
  <div>
    <div class="rule"></div>
    <div class="foot"><span class="l">One fee. Content, ads, growth &mdash; done for you.</span><span class="r">kaizenevol.com</span></div>
  </div>
</div>
</body></html>
