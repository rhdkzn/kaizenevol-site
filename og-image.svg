<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e4dcff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c52d4"/>
      <stop offset="100%" stop-color="#6D3FC0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#6D3FC0" stroke-width="0.6" stroke-opacity="0.07"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circle blob (bottom right) -->
  <circle cx="1050" cy="500" r="280" fill="#6D3FC0" fill-opacity="0.06"/>
  <circle cx="1100" cy="120" r="160" fill="#6D3FC0" fill-opacity="0.04"/>

  <!-- Logo badge -->
  <rect x="80" y="76" width="64" height="64" rx="16" fill="#6D3FC0"/>
  <text x="112" y="123" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">K</text>

  <!-- Brand name -->
  <text x="162" y="120" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111111" letter-spacing="-0.5">KaizenEvol</text>

  <!-- Eyebrow pill -->
  <rect x="80" y="186" width="362" height="36" rx="18" fill="#f0eeff"/>
  <text x="261" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6D3FC0" text-anchor="middle" letter-spacing="1.2">UK KITCHEN CLIENT ACQUISITION</text>

  <!-- Main headline line 1 -->
  <text x="80" y="308" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#111111" letter-spacing="-2">Stop Waiting for</text>

  <!-- Main headline line 2 — accent -->
  <text x="80" y="396" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#6D3FC0" letter-spacing="-2">Referrals.</text>

  <!-- Sub text -->
  <text x="80" y="464" font-family="Arial, sans-serif" font-size="26" fill="#555555">Done-for-you Meta ads for UK kitchen remodellers.</text>
  <text x="80" y="498" font-family="Arial, sans-serif" font-size="26" fill="#555555">Multiple booked clients per month. Live in 7 days.</text>

  <!-- Bottom accent pill -->
  <rect x="80" y="554" width="180" height="10" rx="5" fill="url(#pill)"/>
  <rect x="272" y="558" width="60" height="3" rx="1.5" fill="#6D3FC0" fill-opacity="0.3"/>
</svg>
