<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Responsive Preview — KaizenEvol</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0a0812;font-family:system-ui,sans-serif;color:#f0eeff;padding:24px;}
    h1{font-size:16px;font-weight:600;color:#8B5CF6;margin-bottom:24px;letter-spacing:.05em;text-transform:uppercase;}
    .devices{display:flex;gap:32px;align-items:flex-start;overflow-x:auto;}
    .device{display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0;}
    .device-label{font-size:12px;font-weight:600;color:#7a6fa8;text-transform:uppercase;letter-spacing:.08em;}
    .device-label span{display:block;font-size:11px;font-weight:400;color:#4a4068;margin-top:2px;}
    .frame-wrap{border:2px solid #2c2448;border-radius:12px;overflow:hidden;background:#16122a;box-shadow:0 8px 40px rgba(0,0,0,0.6);}
    .frame-wrap iframe{display:block;border:none;}

    /* mobile */
    .mobile .frame-wrap{border-radius:40px;border-width:8px;padding:12px 6px;background:#1a1438;}
    .mobile .frame-wrap iframe{border-radius:28px;}

    /* tablet */
    .tablet .frame-wrap{border-radius:20px;border-width:5px;}
  </style>
</head>
<body>
  <h1>Responsive Preview — KaizenEvol Dashboard</h1>
  <div class="devices">

    <div class="device mobile">
      <div class="device-label">Mobile <span>375 × 812 — iPhone</span></div>
      <div class="frame-wrap" style="width:375px;">
        <iframe src="dashboard.html" width="375" height="750" scrolling="yes"></iframe>
      </div>
    </div>

    <div class="device tablet">
      <div class="device-label">Tablet <span>768 × 1024 — iPad</span></div>
      <div class="frame-wrap" style="width:768px;">
        <iframe src="dashboard.html" width="768" height="750" scrolling="yes"></iframe>
      </div>
    </div>

    <div class="device desktop">
      <div class="device-label">Desktop <span>1280 × 800</span></div>
      <div class="frame-wrap" style="width:1280px;">
        <iframe src="dashboard.html" width="1280" height="750" scrolling="yes"></iframe>
      </div>
    </div>

  </div>
</body>
</html>
