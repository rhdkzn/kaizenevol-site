<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#F7F6F4" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Take a seat, KaizenEvol</title>
  <meta name="robots" content="noindex" />
  <!-- Share block. funnel-engine sets document.title from the funnel's JSON at runtime,
       which no preview scraper will ever see - they read this static head and nothing
       else. /f.html?f=<name> is an AD and DM destination (dashboard.html counts its
       traffic), so a link to it previewing as a bare URL is our brand missing at the one
       moment someone looks. Generic on purpose: one host serves every funnel. -->
  <meta name="description" content="A few questions so we know whether we can help. We take five at a time and reply either way." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kaizenevol.com/f.html" />
  <meta property="og:site_name" content="KaizenEvol" />
  <meta property="og:title" content="Take a seat, KaizenEvol" />
  <meta property="og:description" content="A few questions so we know whether we can help. We take five at a time and reply either way." />
  <meta property="og:image" content="https://kaizenevol.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Take a seat, KaizenEvol" />
  <meta name="twitter:description" content="A few questions so we know whether we can help. We take five at a time and reply either way." />
  <meta name="twitter:image" content="https://kaizenevol.com/og-image.png" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preload" href="/manrope.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/funnel.css" />
  <link rel="stylesheet" href="/interactions.css" />
  <script src="/utm.js"></script>
</head>
<!-- The generic funnel host. /f.html?f=<name> renders /funnels/<name>.json through
     funnel-engine.js. A new funnel is a JSON file and a link — no new page, no build.
     apply.html stays exactly as it is until this has run against real traffic; it takes
     live leads and is not worth risking to prove a point (2026-09-11, RES-CMP-013). -->
<body class="nojs">

<div class="top">
  <div class="container top-inner">
    <a class="brandline" href="index.html"><img src="brand/v3/ke-mark-ink-256.png" alt="KaizenEvol" onerror="this.style.display='none'"></a>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
</div>

<main>
  <div class="container" id="funnel">
    <noscript><p class="why">This form needs JavaScript. Email <a href="mailto:diego@kaizenevol.com">diego@kaizenevol.com</a> and we will pick it up there.</p></noscript>
  </div>
</main>

<footer>
  <div class="container">
    <a href="mailto:diego@kaizenevol.com">diego@kaizenevol.com</a> &nbsp;&middot;&nbsp;
    <a href="privacy.html">Privacy</a> &nbsp;&middot;&nbsp; &copy; 2026 KaizenEvol
  </div>
</footer>

<script src="/funnel-engine.js"></script>
<script>
  document.body.classList.remove('nojs');
  (function () {
    var name = 'apply';
    try {
      var q = new URLSearchParams(location.search).get('f');
      /* Whitelist the shape rather than the value: a funnel name is a slug, so anything
         with a slash or a dot cannot become a path traversal into the fetch below. */
      if (q && /^[a-z0-9-]{1,40}$/.test(q)) name = q;
    } catch (e) {}
    var root = document.getElementById('funnel');
    KEFunnel.load(name, root)
      .then(function (f) { if (f.spec.title) document.title = f.spec.title; })
      .catch(function (err) {
        root.appendChild(Object.assign(document.createElement('p'), {
          className: 'why',
          textContent: 'That funnel is not available. Email diego@kaizenevol.com and we will pick it up there.'
        }));
        if (window.console) console.error(err);
      });
  })();
</script>
<script defer src="/script.js"></script>
</body>
</html>
