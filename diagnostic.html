<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Free Lead-Flow Diagnostic | KaizenEvol</title>
<link rel="canonical" href="https://kaizenevol.com/diagnostic.html" />
<meta name="description" content="Answer 2 quick questions and get your No.1 growth blocker — and exactly how to fix it. Free, 60 seconds, built for UK renovation firms.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D0B1A'/%3E%3Cpath d='M20 44V20l12 10 12-10v24' fill='none' stroke='%238B5CF6' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!--
  ============================================================================
  KaizenEvol — Lead-Flow Diagnostic  ·  v1.0  ·  2026-07-10
  ----------------------------------------------------------------------------
  A value-first lead magnet: revenue band + biggest blocker -> a PERSONALISED
  diagnosis + fix -> lead capture. Built on the KaizenForge Funnel Engine, with
  a new `result` step type that maps the chosen blocker to real content.
  Questions modelled on a competitor's A/B-proven lead-form (RES-CMP-004) — but
  the diagnoses are ours, honest, and service-mapped (Reach/Desk/Forge).

  Diego's outreach opener: "here's your free diagnosis" > "book a call".
  BEFORE LAUNCH: set FUNNEL.meta.endpoint (form POST) + pixelId (real Pixel).
  ============================================================================
-->
<style>
  :root {
    /* KaizenEvol brand (MKT-BRD-001) */
    --bg:#0D0B1A; --surface:#141228; --surface-2:#1B1836;
    --accent:#8B5CF6; --accent-ink:#fff; --accent-dim:rgba(139,92,246,.16); --accent-line:rgba(139,92,246,.45);
    --text:#EEE8FF; --text-muted:#9A93C4; --border:rgba(255,255,255,.10); --ok:#3FB984; --err:#E5484D;
    --radius:16px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0} html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100dvh;display:flex;flex-direction:column}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
  .back{background:none;border:0;color:var(--text-muted);font-size:22px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer;flex:0 0 auto;visibility:hidden}
  .back:hover{background:var(--surface-2);color:var(--text)} .back.show{visibility:visible}
  .track{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .45s var(--ease)}
  .count{flex:0 0 auto;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 20px 24px;max-width:560px;width:100%;margin:0 auto}
  .step{animation:slideIn .4s var(--ease) both}
  @keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
  h1{font-size:clamp(1.5rem,1.2rem + 2.2vw,2rem);line-height:1.15;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--text-muted);margin-top:10px;font-size:15px}
  .opts{display:grid;gap:10px;margin-top:22px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:var(--radius);padding:16px;font-size:16px;font-weight:600;font-family:var(--font);cursor:pointer;transition:border-color .15s,background .15s,transform .06s;width:100%}
  .opt:hover{border-color:var(--accent-line);background:var(--surface-2)} .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--accent);background:var(--accent-dim)}
  .opt .ico{font-size:22px;flex:0 0 auto;width:26px;text-align:center}
  .opt .tick{margin-left:auto;width:22px;height:22px;border-radius:99px;border:1.5px solid var(--border);flex:0 0 auto;display:grid;place-items:center;font-size:13px;color:transparent}
  .opt.sel .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .field{margin-top:18px} .field label{display:block;font-size:14px;color:var(--text-muted);margin-bottom:7px;font-weight:600}
  .field input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:15px 16px;font-size:16px;color:var(--text);font-family:var(--font)}
  .field input:focus{outline:none;border-color:var(--accent)} .field input.bad{border-color:var(--err)}
  .field .msg{color:var(--err);font-size:13px;margin-top:6px;min-height:16px}
  .cta{margin-top:24px;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:17px;font-size:16px;font-weight:800;font-family:var(--font);cursor:pointer;transition:opacity .15s,transform .06s}
  .cta:disabled{opacity:.4;cursor:not-allowed} .cta:not(:disabled):active{transform:scale(.99)}
  .reassure{text-align:center;color:var(--text-muted);font-size:12.5px;margin-top:14px} .reassure b{color:var(--text)}
  .loader{text-align:center;padding:20px 0} .spinner{width:54px;height:54px;border:4px solid var(--surface-2);border-top-color:var(--accent);border-radius:99px;margin:0 auto 22px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}} .loader .lmsg{font-size:17px;font-weight:600;min-height:24px}
  /* ---- Diagnosis (result step) ---- */
  .diag{margin-top:18px;display:grid;gap:14px}
  .dsec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .dsec.kaizen{border-color:var(--accent-line);background:var(--accent-dim)}
  .dsec .lbl{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:6px}
  .dsec.kaizen .lbl{color:var(--accent-ink)}
  .dsec p{font-size:15px;color:var(--text)}
  /* ---- Done ---- */
  .done{text-align:center} .done .big{width:72px;height:72px;border-radius:99px;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;font-size:36px;margin:0 auto 20px}
  .summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:20px;text-align:left;font-size:14px}
  .summary div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
  .summary div span:first-child{color:var(--text-muted)} .summary div span:last-child{font-weight:600;text-align:right}
  @media (prefers-reduced-motion:reduce){.step{animation:none}.fill{transition:none}.spinner{animation-duration:2s}}
</style>
</head>
<body>
  <div class="bar">
    <button class="back" id="back" aria-label="Go back">&#8592;</button>
    <div class="track" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><div class="fill" id="fill"></div></div>
    <div class="count" id="count"></div>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>

<script>
/* ================= CONFIG ================= */
const FUNNEL = {
  meta: {
    // endpoint: the same route every form on kaizenevol.com posts to. It promotes
    // {name, email} to contactName/businessName exactly like the homepage one-pager,
    // so this payload needs no reshaping (verified against api/submit-lead.js 2026-08-01).
    endpoint: "/api/submit-lead",
    // pixelId REMOVED 2026-08-01: it was declared and never read. Tracking here rides
    // the host page's consent-gated pixel — px()/pxLead() fire only `if (window.fbq)`,
    // and on kaizenevol.com fbq exists only after an explicit Accept (/script.js).
    // Do NOT add a pixel loader to this file: a second, ungated loader is exactly the
    // duplicate-consent bug deleted from midnight.js the same week.
    business: "KaizenEvol",
    summary: [["Monthly revenue","revenue"],["Your No.1 blocker","blocker"]],
    thankYou: "Your full fix plan is on its way. We'll be in touch within one working day — no pressure, no spam. In the meantime, the diagnosis above is yours to act on today."
  },
  steps: [
    { id: "revenue", type: "single", eyebrow: "Free lead-flow diagnostic",
      title: "First — what's your monthly revenue right now?",
      sub: "60 seconds. You'll get your No.1 growth blocker and exactly how to fix it — free.",
      options: [
        { label: "Under £20k", icon: "🌱", score: 1 },
        { label: "£20k–£35k", icon: "📈", score: 2 },
        { label: "£35k–£45k", icon: "🚀", score: 2 },
        { label: "£45k–£60k", icon: "🏗️", score: 3 },
        { label: "£60k+", icon: "🏆", score: 3 }
      ] },
    { id: "blocker", type: "single",
      title: "What's the biggest thing holding you back right now?",
      sub: "Be honest — pick the one that stings most.",
      options: [
        { label: "Low-quality leads", icon: "🎯", score: 1 },
        { label: "Not enough leads / work", icon: "📉", score: 2 },
        { label: "Scaling", icon: "📊", score: 2 },
        { label: "Install capacity", icon: "🔧", score: 1 },
        { label: "Sales follow-up", icon: "📞", score: 2 },
        { label: "Pricing pressure", icon: "💷", score: 1 }
      ] },
    { id: "analyse", type: "loader", ms: 2400,
      messages: ["Reading your answers…", "Matching your No.1 blocker…", "Pulling the fix that works for it…", "Preparing your diagnosis…"] },
    { id: "result", type: "result", on: "blocker",
      eyebrow: "Your diagnosis",
      title: "Your No.1 blocker: {{answers.blocker}}",
      cta: "Get my full fix plan →",
      map: {
        "Low-quality leads": {
          why: "Leads that ghost or haggle usually aren't a volume problem — they're a filtering problem. If anyone can enquire in two taps, you get everyone, tyre-kickers included.",
          fix: "Qualify BEFORE they reach your phone. A short funnel that asks budget, timeline and scope means every enquiry that lands is one actually worth calling.",
          kaizen: "This is exactly what KaizenReach's front end does — homeowners tell us their budget and timeline before they ever hit your diary."
        },
        "Not enough leads / work": {
          why: "Relying on word-of-mouth means great months and dead months — and taking jobs you'd normally walk away from just to cover costs. That's a pipeline problem, not a craftsmanship one.",
          fix: "Add one predictable channel you control. Paid ads aimed at your exact job type in your exact area turn the tap from 'hope' to 'on'.",
          kaizen: "KaizenReach runs that channel — one niche per area, and our first 5 clients get their first 60 days free (ad spend only)."
        },
        "Scaling": {
          why: "You've maxed what word-of-mouth plus you-doing-everything can produce. The ceiling isn't demand — it's that growth is still tied to your hours.",
          fix: "Systemise the two things that don't scale by hand: bringing leads in, and following them up. Once those run without you, capacity is the only limit.",
          kaizen: "That's the KaizenReach + KaizenDesk stack — ads bring them in, an AI front office catches and chases every one."
        },
        "Install capacity": {
          why: "You've got demand you can't fulfil — a good problem, but it means more leads right now would just build a longer waiting list and frustrated homeowners.",
          fix: "Don't buy ads yet. Tighten scheduling and capacity first, then scale demand to match. Pouring leads onto a full diary burns your reputation.",
          kaizen: "We'd tell you to hold off on ads until you're ready — start with a proper site + AI front office so no enquiry is lost while you catch up. Honest advice beats a sale."
        },
        "Sales follow-up": {
          why: "Enquiries are coming in but leaking out — a slow reply, a missed call while you're on the tools, no follow-up. Most of every 10 enquiries never become a booked survey for exactly this reason.",
          fix: "Answer everything, instantly, and chase every lead automatically. Speed-to-lead is the single biggest lever most local businesses never pull.",
          kaizen: "KaizenDesk is an AI front office that answers 24/7 — even at 9pm while you're asleep — and books the survey for you."
        },
        "Pricing pressure": {
          why: "You're being pushed on price because, on paper, you look like every other firm. When the only visible difference is the quote, homeowners shop the quote.",
          fix: "Stop competing on price by not looking like everyone else. A premium web presence and clear positioning make you the obvious choice, not the cheapest.",
          kaizen: "KaizenForge builds the site that makes you look like the biggest firm in the county — so you're compared on trust, not just on price."
        },
        "_default": {
          why: "Whatever's holding you back, it almost always traces to one of three things: not enough leads, the wrong leads, or leads that leak before they book.",
          fix: "Fix the pipeline in the right order — bring the right leads in, then make sure none are lost — and growth stops being a guessing game.",
          kaizen: "That's the whole KaizenEvol stack: Reach (leads), Desk (catch them), Forge (convert them)."
        }
      } },
    { id: "contact", type: "contact", eyebrow: "Almost there",
      title: "Where shall we send your full fix plan?",
      sub: "The detailed roadmap for your blocker — plus a no-pressure look at whether we can build it for you.",
      fields: [
        { name: "name", label: "Your name", type: "text", required: true },
        { name: "email", label: "Email", type: "email", required: true },
        { name: "phone", label: "Mobile (so we can talk it through)", type: "tel", required: false }
      ],
      submitLabel: "Send my fix plan →",
      reassure: "🔒 One email, your plan, no spam. <b>We only take on one firm per area.</b>" }
  ]
};

/* ================= ENGINE ================= */
(function () {
  const stage=document.getElementById('stage'), fill=document.getElementById('fill'), pb=document.getElementById('pb'),
        count=document.getElementById('count'), backBtn=document.getElementById('back');
  const KEY='kf_diag_'+(FUNNEL.meta.business||'x').replace(/\W+/g,'').toLowerCase();
  const NONCOUNT=['loader','proof','result'];
  const utm={}; new URLSearchParams(location.search).forEach((v,k)=>{ if(/^utm_|gclid|fbclid/i.test(k)) utm[k]=v; });
  let state={i:0,answers:{},score:0};
  try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s && s.i<FUNNEL.steps.length) state=s; }catch(e){}
  function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
  function px(ev,d){ try{ if(window.fbq) window.fbq('trackCustom',ev,d||{}); }catch(e){} }
  function pxLead(){ try{ if(window.fbq) window.fbq('track','Lead'); }catch(e){} }
  function pipe(str){ return (str||'').replace(/\{\{answers\.(\w+)\}\}/g,(_,k)=>state.answers[k]??''); }
  const totalCountable=FUNNEL.steps.filter(s=>!NONCOUNT.includes(s.type)).length;
  function progress(){ const a=FUNNEL.steps.slice(0,state.i).filter(s=>!NONCOUNT.includes(s.type)).length; return Math.round(a/totalCountable*100); }

  function render(){
    persist();
    if(state.i>=FUNNEL.steps.length) return renderDone();
    const step=FUNNEL.steps[state.i], p=progress();
    fill.style.width=p+'%'; pb.setAttribute('aria-valuenow',p);
    const shown=FUNNEL.steps.slice(0,state.i+1).filter(s=>!NONCOUNT.includes(s.type)).length;
    count.textContent=NONCOUNT.includes(step.type)?'':shown+'/'+totalCountable;
    backBtn.classList.toggle('show',state.i>0);
    px('FunnelStep',{step:step.id,index:state.i});
    const el=document.createElement('section'); el.className='step'; el.innerHTML=head(step)+body(step);
    stage.innerHTML=''; stage.appendChild(el); wire(step,el);
    const f=el.querySelector('.opt,input,.cta'); if(f) f.focus({preventScroll:true});
  }
  function head(step){
    return (step.eyebrow?`<div class="eyebrow">${pipe(step.eyebrow)}</div>`:'')+
           (step.title?`<h1>${pipe(step.title)}</h1>`:'')+
           (step.sub?`<p class="sub">${pipe(step.sub)}</p>`:'');
  }
  function body(step){
    switch(step.type){
      case 'single': return `<div class="opts" role="radiogroup">`+step.options.map((o,i)=>
        `<button class="opt" role="radio" aria-checked="false" data-idx="${i}">${o.icon?`<span class="ico">${o.icon}</span>`:''}<span>${o.label}</span><span class="tick">✓</span></button>`).join('')+`</div>`;
      case 'result': {
        const d=(step.map&&step.map[state.answers[step.on]])||step.map._default||{};
        const sec=(l,t,cls)=>t?`<div class="dsec${cls||''}"><span class="lbl">${l}</span><p>${t}</p></div>`:'';
        return `<div class="diag">${sec("Why it's happening",d.why)}${sec("The fix",d.fix)}${sec("How we'd solve it",d.kaizen,' kaizen')}</div>
                <button class="cta" data-continue>${step.cta||'Continue'}</button>`;
      }
      case 'contact': return `<form novalidate>`+step.fields.map(f=>
        `<div class="field"><label for="f_${f.name}">${f.label}${f.required?'':' <span style="opacity:.6">(optional)</span>'}</label>
           <input id="f_${f.name}" name="${f.name}" type="${f.type||'text'}" ${f.required?'required':''} autocomplete="${f.name==='phone'?'tel':f.name==='name'?'name':f.name==='email'?'email':'on'}">
           <div class="msg" data-msg-for="${f.name}"></div></div>`).join('')+
        `<button class="cta" type="submit">${step.submitLabel||'Submit'}</button>${step.reassure?`<p class="reassure">${step.reassure}</p>`:''}</form>`;
      case 'loader': return `<div class="loader"><div class="spinner"></div><div class="lmsg" id="lm">${step.messages[0]}</div></div>`;
      default: return '';
    }
  }
  function advance(sc,goto){ if(typeof sc==='number') state.score+=sc; state.i=(goto!=null)?FUNNEL.steps.findIndex(s=>s.id===goto):state.i+1; if(state.i<0) state.i=FUNNEL.steps.length; render(); }
  function wire(step,el){
    if(step.type==='single'){ el.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{ const o=step.options[+b.dataset.idx]; state.answers[step.id]=o.label; b.classList.add('sel'); b.setAttribute('aria-checked','true'); setTimeout(()=>advance(o.score||0,o.goto),140); })); }
    if(step.type==='result'){ el.querySelector('[data-continue]').addEventListener('click',()=>advance(0)); }
    if(step.type==='contact'){ const form=el.querySelector('form'); form.addEventListener('submit',e=>{ e.preventDefault(); let ok=true;
      step.fields.forEach(f=>{ const inp=form.querySelector(`[name="${f.name}"]`), msg=form.querySelector(`[data-msg-for="${f.name}"]`), v=inp.value.trim(); let er='';
        if(f.required&&!v) er='Required';
        else if(f.type==='email'&&v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) er='Enter a valid email';
        else if(f.type==='tel'&&v&&!/^[0-9 +()-]{7,}$/.test(v)) er='Enter a valid number';
        inp.classList.toggle('bad',!!er); msg.textContent=er; if(er) ok=false; state.answers[f.name]=v; });
      if(ok) submit(); }); }
    if(step.type==='loader'){ let k=0; const lm=el.querySelector('#lm'), red=matchMedia('(prefers-reduced-motion:reduce)').matches, tot=red?900:(step.ms||2400);
      const iv=setInterval(()=>{ k=(k+1)%step.messages.length; if(lm) lm.textContent=step.messages[k]; },tot/step.messages.length);
      setTimeout(()=>{ clearInterval(iv); advance(0); },tot); }
  }
  function submit(){
    const band=state.score>=5?'hot':state.score>=3?'warm':'nurture';
    const payload={...state.answers,_score:state.score,_band:band,_source:'lead-flow-diagnostic',_business:FUNNEL.meta.business,...utm,_ts:new Date().toISOString()};
    pxLead(); px('DiagnosticComplete',{band,score:state.score,blocker:state.answers.blocker});
    // A lead that failed to save must NEVER render as success. The old `.catch(()=>{})`
    // swallowed every error, so a 400 or a dead endpoint showed the done screen and the
    // enquiry vanished with no trace on either side. Show the result screen only after
    // the save is confirmed; otherwise say so and give them a way to reach us.
    if(FUNNEL.meta.endpoint){
      fetch(FUNNEL.meta.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
        .then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json().catch(()=>({ok:true})); })
        .then(()=>{ state.i=FUNNEL.steps.length; persist(); renderDone(); })
        .catch(err=>{ console.error('[diagnostic] lead NOT saved:',err); failSend(); });
      return;
    }
    console.log('[diagnostic demo] no endpoint set — lead payload:',payload);
    state.i=FUNNEL.steps.length; persist(); renderDone();
  }
  function failSend(){
    // Write into #stage, the same element renderDone() uses — never document.body,
    // which would wipe the progress bar and the page chrome with it.
    stage.innerHTML='<div style="text-align:center;padding:28px 18px">'
      +'<h2 style="margin:0 0 10px">That didn\'t send.</h2>'
      +'<p style="margin:0 0 16px;opacity:.8">Your answers are safe on this page — but we didn\'t get them, '
      +'so nobody is going to email you. Rather than pretend otherwise: send us the word "plan" at '
      +'<a href="mailto:rahaid@kaizenevol.com?subject=Fix%20plan">rahaid@kaizenevol.com</a> and we\'ll do it by hand.</p>'
      +'<button type="button" onclick="location.reload()" style="padding:12px 20px;border-radius:999px;border:0;cursor:pointer">Try again</button>'
      +'</div>';
  }

  function renderDone(){
    try{ localStorage.removeItem(KEY); }catch(e){}
    fill.style.width='100%'; pb.setAttribute('aria-valuenow',100); count.textContent=''; backBtn.classList.remove('show');
    const a=state.answers;
    const rows=(FUNNEL.meta.summary||[]).map(([label,key])=>a[key]?`<div><span>${label}</span><span>${a[key]}</span></div>`:'').join('');
    stage.innerHTML=`<section class="step done"><div class="big">✓</div>
        <h1>You're all set${a.name?', '+a.name.split(' ')[0]:''}.</h1>
        <p class="sub">${FUNNEL.meta.thankYou}</p>${rows?`<div class="summary">${rows}</div>`:''}</section>`;
  }
  backBtn.addEventListener('click',()=>{ if(state.i>0){ state.i=Math.max(0,state.i-1); render(); } });
  render();
})();
</script>
<script defer src="/script.js"></script>
</body>
</html>
